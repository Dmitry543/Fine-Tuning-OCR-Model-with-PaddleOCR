name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pillow tqdm rapidfuzz shapely pyyaml pytest
      - run: pytest tests -q
      - run: bash -n setup.sh && bash -n finetune.sh
